syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.AwcService.Protos";

package gameinterfaceawcrecordservice;

// The greeting service definition.
service GameInterfaceAwcRecordService {
  // Sends a greeting
  rpc GamePullRecordByAwcAeLotto (GamePullRecordeRequest) returns (GamePullRecordReply);
  rpc GamePullRecordByAwcAws (GamePullRecordeRequest) returns (GamePullRecordReply);
  rpc GamePullRecordByAwcCockfight (GamePullRecordeRequest) returns (GamePullRecordReply);
  rpc GamePullRecordByAwcFacai (GamePullRecordeRequest) returns (GamePullRecordReply);
  rpc GamePullRecordByAwcFs (GamePullRecordeRequest) returns (GamePullRecordReply);
  rpc GamePullRecordByAwcKm (GamePullRecordeRequest) returns (GamePullRecordReply);
  rpc GamePullRecordByAwcLudo (GamePullRecordeRequest) returns (GamePullRecordReply);
  rpc GamePullRecordByAwcPgs (GamePullRecordeRequest) returns (GamePullRecordReply);
  rpc GamePullRecordByAwcRcb (GamePullRecordeRequest) returns (GamePullRecordReply);
  rpc GamePullRecordByAwcSg (GamePullRecordeRequest) returns (GamePullRecordReply);
  rpc GamePullRecordByAwcSpade (GamePullRecordeRequest) returns (GamePullRecordReply);
  rpc GamePullRecordByAwcVenus (GamePullRecordeRequest) returns (GamePullRecordReply);
  rpc GamePullRecordByAwcYl (GamePullRecordeRequest) returns (GamePullRecordReply);
  rpc GameSettleByAwcAeLotto (GameSettleRequest) returns (GameSettleRecordReply);
  rpc GameSettleByAwcAws (GameSettleRequest) returns (GameSettleRecordReply);
  rpc GameSettleByAwcCockfight (GameSettleRequest) returns (GameSettleRecordReply);
  rpc GameSettleByAwcFacai (GameSettleRequest) returns (GameSettleRecordReply);
  rpc GameSettleByAwcFs (GameSettleRequest) returns (GameSettleRecordReply);
  rpc GameSettleByAwcKm (GameSettleRequest) returns (GameSettleRecordReply);
  rpc GameSettleByAwcLudo (GameSettleRequest) returns (GameSettleRecordReply);
  rpc GameSettleByAwcPgs (GameSettleRequest) returns (GameSettleRecordReply);
  rpc GameSettleByAwcRcb (GameSettleRequest) returns (GameSettleRecordReply);
  rpc GameSettleByAwcSg (GameSettleRequest) returns (GameSettleRecordReply);
  rpc GameSettleByAwcSpade (GameSettleRequest) returns (GameSettleRecordReply);
  rpc GameSettleByAwcVenus (GameSettleRequest) returns (GameSettleRecordReply);
  rpc GameSettleByAwcYl (GameSettleRequest) returns (GameSettleRecordReply);
  rpc GameUnsettleByAwcAeLotto (GameUnsettleRequest) returns (GameUnsettleRecordReply);
  rpc GameUnsettleByAwcCockfight (GameUnsettleRequest) returns (GameUnsettleRecordReply);
  rpc GameUnsettleByAwcRcb (GameUnsettleRequest) returns (GameUnsettleRecordReply);
}

// The request message containing the user's name.
message GameSettleRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	google.protobuf.Timestamp start_time=4; 
    google.protobuf.Timestamp end_time=5; 
}

message GameUnsettleRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	google.protobuf.Timestamp start_time=4; 
    google.protobuf.Timestamp end_time=5; 
}

message GamePullRecordeRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	google.protobuf.Timestamp time_from=4; 
}

// The response message containing the greetings.
message GamePullRecordReply {
	repeated GamePullRecord items = 1;
}

message GamePullRecord {
	string external_round_id = 1;
	string platform = 2;
	string platform_tx_id = 3;
	string game_type = 4;
	string game_code = 5;
	string game_name = 6;
	string round_id = 7;
	string user_id = 8;
	string currency = 9;
	int32 tx_status = 10;
	int32 settle_status = 11;
	string bet_time=12; 
	string tx_time=13; 
	string update_time=14; 
	string bet_type = 15;
	phoenix.protobuf.DecimalValue bet_amount = 16;
	phoenix.protobuf.DecimalValue real_bet_amount = 17;
	phoenix.protobuf.DecimalValue turnover = 18;
	phoenix.protobuf.DecimalValue win_amount = 19;
	phoenix.protobuf.DecimalValue real_win_amount = 20;
	phoenix.protobuf.DecimalValue jackpot_bet_amount = 21;
	phoenix.protobuf.DecimalValue jackpot_win_amount = 22;
	string game_info = 23;
	string additional_data = 24;
}

message GameSettleRecordReply {
	repeated GameSettleRecord items = 1;
}

message GameSettleRecord {
	string external_round_id = 1;
	string platform = 2;
	string platform_tx_id = 3;
	string game_type = 4;
	string game_code = 5;
	string game_name = 6;
	string round_id = 7;
	string user_id = 8;
	string currency = 9;
	int32 tx_status = 10;
	int32 settle_status = 11;
	string bet_time=12; 
	string tx_time=13; 
	string update_time=14; 
	string bet_type = 15;
	phoenix.protobuf.DecimalValue bet_amount = 16;
	phoenix.protobuf.DecimalValue real_bet_amount = 17;
	phoenix.protobuf.DecimalValue turnover = 18;
	phoenix.protobuf.DecimalValue win_amount = 19;
	phoenix.protobuf.DecimalValue real_win_amount = 20;
	phoenix.protobuf.DecimalValue jackpot_bet_amount = 21;
	phoenix.protobuf.DecimalValue jackpot_win_amount = 22;
	string game_info = 23;
	string additional_data = 24;
}

message GameUnsettleRecordReply {
	repeated GameUnsettleRecord items = 1;
}

message GameUnsettleRecord {
	string external_round_id = 1;
	string platform = 2;
	string platform_tx_id = 3;
	string game_type = 4;
	string game_code = 5;
	string game_name = 6;
	string round_id = 7;
	string user_id = 8;
	string currency = 9;
	string bet_time=10; 
	string bet_type = 11;
	phoenix.protobuf.DecimalValue bet_amount = 12;
	phoenix.protobuf.DecimalValue real_bet_amount = 13;
	phoenix.protobuf.DecimalValue jackpot_bet_amount = 14;
	string game_info = 15;
	string additional_data = 16;
}