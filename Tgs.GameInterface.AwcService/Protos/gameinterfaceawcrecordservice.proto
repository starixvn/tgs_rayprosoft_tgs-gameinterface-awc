syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.AwcService.Protos";

package gameinterfaceawcrecordservice;

// The greeting service definition.
service GameInterfaceAwcRecordService {
  // Sends a greeting
  rpc GamePullRecordByAwcAeLotto (GameInterfaceAwcServiceGamePullRecordeRequest) returns (GameInterfaceAwcServiceGamePullRecordReply);
  rpc GamePullRecordByAwcAws (GameInterfaceAwcServiceGamePullRecordeRequest) returns (GameInterfaceAwcServiceGamePullRecordReply);
  rpc GamePullRecordByAwcCockfight (GameInterfaceAwcServiceGamePullRecordeRequest) returns (GameInterfaceAwcServiceGamePullRecordReply);
  rpc GamePullRecordByAwcFacai (GameInterfaceAwcServiceGamePullRecordeRequest) returns (GameInterfaceAwcServiceGamePullRecordReply);
  rpc GamePullRecordByAwcFs (GameInterfaceAwcServiceGamePullRecordeRequest) returns (GameInterfaceAwcServiceGamePullRecordReply);
  rpc GamePullRecordByAwcKm (GameInterfaceAwcServiceGamePullRecordeRequest) returns (GameInterfaceAwcServiceGamePullRecordReply);
  rpc GamePullRecordByAwcLudo (GameInterfaceAwcServiceGamePullRecordeRequest) returns (GameInterfaceAwcServiceGamePullRecordReply);
  rpc GamePullRecordByAwcPgs (GameInterfaceAwcServiceGamePullRecordeRequest) returns (GameInterfaceAwcServiceGamePullRecordReply);
  rpc GamePullRecordByAwcRcb (GameInterfaceAwcServiceGamePullRecordeRequest) returns (GameInterfaceAwcServiceGamePullRecordReply);
  rpc GamePullRecordByAwcSg (GameInterfaceAwcServiceGamePullRecordeRequest) returns (GameInterfaceAwcServiceGamePullRecordReply);
  rpc GamePullRecordByAwcSpade (GameInterfaceAwcServiceGamePullRecordeRequest) returns (GameInterfaceAwcServiceGamePullRecordReply);
  rpc GamePullRecordByAwcVenus (GameInterfaceAwcServiceGamePullRecordeRequest) returns (GameInterfaceAwcServiceGamePullRecordReply);
  rpc GamePullRecordByAwcYl (GameInterfaceAwcServiceGamePullRecordeRequest) returns (GameInterfaceAwcServiceGamePullRecordReply);
  rpc GameSettleByAwcAeLotto (GameInterfaceAwcServiceGameSettleRequest) returns (GameInterfaceAwcServiceGameSettleRecordReply);
  rpc GameSettleByAwcAws (GameInterfaceAwcServiceGameSettleRequest) returns (GameInterfaceAwcServiceGameSettleRecordReply);
  rpc GameSettleByAwcCockfight (GameInterfaceAwcServiceGameSettleRequest) returns (GameInterfaceAwcServiceGameSettleRecordReply);
  rpc GameSettleByAwcFacai (GameInterfaceAwcServiceGameSettleRequest) returns (GameInterfaceAwcServiceGameSettleRecordReply);
  rpc GameSettleByAwcFs (GameInterfaceAwcServiceGameSettleRequest) returns (GameInterfaceAwcServiceGameSettleRecordReply);
  rpc GameSettleByAwcKm (GameInterfaceAwcServiceGameSettleRequest) returns (GameInterfaceAwcServiceGameSettleRecordReply);
  rpc GameSettleByAwcLudo (GameInterfaceAwcServiceGameSettleRequest) returns (GameInterfaceAwcServiceGameSettleRecordReply);
  rpc GameSettleByAwcPgs (GameInterfaceAwcServiceGameSettleRequest) returns (GameInterfaceAwcServiceGameSettleRecordReply);
  rpc GameSettleByAwcRcb (GameInterfaceAwcServiceGameSettleRequest) returns (GameInterfaceAwcServiceGameSettleRecordReply);
  rpc GameSettleByAwcSg (GameInterfaceAwcServiceGameSettleRequest) returns (GameInterfaceAwcServiceGameSettleRecordReply);
  rpc GameSettleByAwcSpade (GameInterfaceAwcServiceGameSettleRequest) returns (GameInterfaceAwcServiceGameSettleRecordReply);
  rpc GameSettleByAwcVenus (GameInterfaceAwcServiceGameSettleRequest) returns (GameInterfaceAwcServiceGameSettleRecordReply);
  rpc GameSettleByAwcYl (GameInterfaceAwcServiceGameSettleRequest) returns (GameInterfaceAwcServiceGameSettleRecordReply);
  rpc GameUnsettleByAwcAeLotto (GameInterfaceAwcServiceGameUnsettleRequest) returns (GameInterfaceAwcServiceGameUnsettleRecordReply);
  rpc GameUnsettleByAwcCockfight (GameInterfaceAwcServiceCockFightGameUnsettleRequest) returns (GameInterfaceAwcServiceGameUnsettleRecordReply);
  rpc GameUnsettleByAwcRcb (GameInterfaceAwcServiceGameUnsettleRequest) returns (GameInterfaceAwcServiceGameUnsettleRecordReply);
}

// The request message containing the user's name.
message GameInterfaceAwcServiceGameSettleRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	google.protobuf.Timestamp start_time=4; 
    google.protobuf.Timestamp end_time=5; 
}

message GameInterfaceAwcServiceGameUnsettleRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	google.protobuf.Timestamp start_time=4; 
    google.protobuf.Timestamp end_time=5; 
}

message GameInterfaceAwcServiceCockFightGameUnsettleRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	google.protobuf.Timestamp time_from=4; 
}

message GameInterfaceAwcServiceGamePullRecordeRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	google.protobuf.Timestamp time_from=4; 
}



// The response message containing the greetings.
message GameInterfaceAwcServiceGamePullRecordReply {
	repeated GameInterfaceAwcServiceGamePullRecord items = 1;
}

message GameInterfaceAwcServiceGamePullRecord {
	string external_round_id = 1;
	string platform = 2;
	string platform_tx_id = 3;
	string game_type = 4;
	string game_code = 5;
	string game_name = 6;
	string round_id = 7;
	string user_id = 8;
	string currency = 9;
	int32 tx_status = 10;
	int32 settle_status = 11;
	string bet_time=12; 
	string tx_time=13; 
	string update_time=14; 
	string bet_type = 15;
	phoenix.protobuf.DecimalValue bet_amount = 16;
	phoenix.protobuf.DecimalValue real_bet_amount = 17;
	phoenix.protobuf.DecimalValue turnover = 18;
	phoenix.protobuf.DecimalValue win_amount = 19;
	phoenix.protobuf.DecimalValue real_win_amount = 20;
	phoenix.protobuf.DecimalValue jackpot_bet_amount = 21;
	phoenix.protobuf.DecimalValue jackpot_win_amount = 22;
	string game_info = 23;
}

message GameInterfaceAwcServiceGameSettleRecordReply {
	repeated GameInterfaceAwcServiceGameSettleRecord items = 1;
}

message GameInterfaceAwcServiceGameSettleRecord {
	string external_round_id = 1;
	string platform = 2;
	string platform_tx_id = 3;
	string game_type = 4;
	string game_code = 5;
	string game_name = 6;
	string round_id = 7;
	string user_id = 8;
	string currency = 9;
	int32 tx_status = 10;
	int32 settle_status = 11;
	string bet_time=12; 
	string tx_time=13; 
	string update_time=14; 
	string bet_type = 15;
	phoenix.protobuf.DecimalValue bet_amount = 16;
	phoenix.protobuf.DecimalValue real_bet_amount = 17;
	phoenix.protobuf.DecimalValue turnover = 18;
	phoenix.protobuf.DecimalValue win_amount = 19;
	phoenix.protobuf.DecimalValue real_win_amount = 20;
	phoenix.protobuf.DecimalValue jackpot_bet_amount = 21;
	phoenix.protobuf.DecimalValue jackpot_win_amount = 22;
	string game_info = 23;
}

message GameInterfaceAwcServiceGameUnsettleRecordReply {
	repeated GameInterfaceAwcServiceGameUnsettleRecord items = 1;
}

message GameInterfaceAwcServiceGameUnsettleRecord {
	string external_round_id = 1;
	string platform = 2;
	string platform_tx_id = 3;
	string game_type = 4;
	string game_code = 5;
	string game_name = 6;
	string round_id = 7;
	string user_id = 8;
	string currency = 9;
	string bet_time=10; 
	string bet_type = 11;
	phoenix.protobuf.DecimalValue bet_amount = 12;
	phoenix.protobuf.DecimalValue real_bet_amount = 13;
	phoenix.protobuf.DecimalValue jackpot_bet_amount = 14;
	string game_info = 15;
}
