syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.AwcService.Protos";

package gameinterfaceawcservice;

// The greeting service definition.
service GameInterfaceAwcService {
  // Sends a greeting
  rpc CreatePlayer (CreatePlayerRequest) returns (BaseReply);
  rpc CreatePlayerByBetLimit (CreatePlayerByBetLimitRequest) returns (BaseReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOrderChecking(FundOrderCheckingRequest) returns (FundOrderCheckingReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc GetBalance (BalanceRequest) returns (BalanceReply);
  rpc GetBalances (BalancesRequest) returns (BalancesReply);
  rpc KickPlayer (KickPlayerRequest) returns (BaseReply);
  rpc GameUrlByAwcAeLotto (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcAws (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcFacai (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcFs (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcKm (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcLudo (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcPgs (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcSpade (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcYl (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByLiveLobbyByAwcCockfight (GameUrlByLiveLobbyRequest) returns (GameUrlReply);
  rpc GameUrlLiveLobbyByAwcRcb (GameUrlByLiveLobbyRequest) returns (GameUrlReply);
  rpc GameUrlLiveLobbyByAwcSg (GameUrlByLiveLobbyRequest) returns (GameUrlReply);
  rpc GameUrlLiveLobbyByAwcVenus (GameUrlByLiveLobbyRequest) returns (GameUrlReply);
}

// The request message containing the user's name.
message FundRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	string transaction_id = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundOrderCheckingRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string transaction_id = 4;
}

message BalanceRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
}

message BalancesRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
}

message KickPlayerRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
}

message CreatePlayerRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	string user_name = 5;
	string currency = 6;
	string language = 7;
}

message CreatePlayerByBetLimitRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	string user_name = 5;
	string currency = 6;
	string bet_limit = 7;
	string language = 8;
}


message GameUrlRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	bool is_mobile_login = 5;
	string back_url = 6;
	string external_game_id = 7;
	string language = 8;
}

message GameUrlByLiveLobbyRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	bool is_mobile_login = 5;
	string back_url = 6;
	string bet_limit = 7;
	string language = 8;
}

// The response message containing the greetings.
message BaseReply {
	bool success = 1;
}

message FundReply {
	bool success = 1;
	string message = 2;
	string transaction_id = 3;
	string game_provider_transaction_id = 4;
	phoenix.protobuf.DecimalValue amount = 5;
	phoenix.protobuf.DecimalValue current_balance = 6;
}

message FundOrderCheckingReply {
	bool exist = 1;
}

message BalanceReply {
	bool success = 1;
	string message = 2;
	bool is_player_exist = 3;
	phoenix.protobuf.DecimalValue balance = 4;
}

message BalancesReply {
	repeated BalanceRecord items = 1;
}

message BalanceRecord {
	string user_id = 1;
	phoenix.protobuf.DecimalValue balance = 2;
	google.protobuf.Timestamp last_modified = 3; 
}


message GameUrlReply {
	bool success = 1;
	string message = 2;
	bool is_player_exist = 3;
	string game_url = 4;
}
