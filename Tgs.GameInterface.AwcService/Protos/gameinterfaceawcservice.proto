syntax = "proto3";

import "phoenix/protobuf/decimal.proto";

option csharp_namespace = "Tgs.GameInterface.AwcService.Protos";

package gameinterfaceawcservice;

// The greeting service definition.
service GameInterfaceAwcService {
  // Sends a greeting
  rpc CreatePlayer (GameInterfaceAwcServiceCreatePlayerRequest) returns (GameInterfaceAwcServiceReply);
  rpc CreatePlayerByBetLimit (GameInterfaceAwcServiceCreatePlayerByBetLimitRequest) returns (GameInterfaceAwcServiceReply);
  rpc FundIn (GameInterfaceAwcServiceFundRequest) returns (GameInterfaceAwcServiceFundReply);
  rpc FundOrderChecking(GameInterfaceAwcServiceFundOrderCheckingRequest) returns (GameInterfaceAwcServiceFundOrderCheckingReply);
  rpc FundOut (GameInterfaceAwcServiceFundRequest) returns (GameInterfaceAwcServiceFundReply);
  rpc GetBalance (GameInterfaceAwcServiceBalanceRequest) returns (GameInterfaceAwcServiceBalanceReply);
  rpc KickPlayer (GameInterfaceAwcServiceKickPlayerRequest) returns (GameInterfaceAwcServiceReply);
  rpc GameUrlByAwcAeLotto (GameInterfaceAwcServiceGameUrlRequest) returns (GameInterfaceAwcServiceGameUrlReply);
  rpc GameUrlByAwcAws (GameInterfaceAwcServiceGameUrlRequest) returns (GameInterfaceAwcServiceGameUrlReply);
  rpc GameUrlByAwcFacai (GameInterfaceAwcServiceGameUrlRequest) returns (GameInterfaceAwcServiceGameUrlReply);
  rpc GameUrlByAwcFs (GameInterfaceAwcServiceGameUrlRequest) returns (GameInterfaceAwcServiceGameUrlReply);
  rpc GameUrlByAwcKm (GameInterfaceAwcServiceGameUrlRequest) returns (GameInterfaceAwcServiceGameUrlReply);
  rpc GameUrlByAwcLudo (GameInterfaceAwcServiceGameUrlRequest) returns (GameInterfaceAwcServiceGameUrlReply);
  rpc GameUrlByAwcPgs (GameInterfaceAwcServiceGameUrlRequest) returns (GameInterfaceAwcServiceGameUrlReply);
  rpc GameUrlByAwcSpade (GameInterfaceAwcServiceGameUrlRequest) returns (GameInterfaceAwcServiceGameUrlReply);
  rpc GameUrlByAwcYl (GameInterfaceAwcServiceGameUrlRequest) returns (GameInterfaceAwcServiceGameUrlReply);
  rpc GameUrlByLiveLobbyByAwcCockfight (GameInterfaceAwcServiceGameUrlByLiveLobbyRequest) returns (GameInterfaceAwcServiceGameUrlReply);
  rpc GameUrlLiveLobbyByAwcRcb (GameInterfaceAwcServiceGameUrlByLiveLobbyRequest) returns (GameInterfaceAwcServiceGameUrlReply);
  rpc GameUrlLiveLobbyByAwcSg (GameInterfaceAwcServiceGameUrlByLiveLobbyRequest) returns (GameInterfaceAwcServiceGameUrlReply);
  rpc GameUrlLiveLobbyByAwcVenus (GameInterfaceAwcServiceGameUrlByLiveLobbyRequest) returns (GameInterfaceAwcServiceGameUrlReply);
}

// The request message containing the user's name.
message GameInterfaceAwcServiceFundRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	string transaction_id = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message GameInterfaceAwcServiceFundOrderCheckingRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string transaction_id = 4;
}

message GameInterfaceAwcServiceBalanceRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
}

message GameInterfaceAwcServiceKickPlayerRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
}

message GameInterfaceAwcServiceCreatePlayerRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	string user_name = 5;
	string currency = 6;
	string language = 7;
}

message GameInterfaceAwcServiceCreatePlayerByBetLimitRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	string user_name = 5;
	string currency = 6;
	string bet_limit = 7;
	string language = 8;
}


message GameInterfaceAwcServiceGameUrlRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	bool is_mobile_login = 5;
	string back_url = 6;
	string external_game_id = 7;
	string language = 8;
}

message GameInterfaceAwcServiceGameUrlByLiveLobbyRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	bool is_mobile_login = 5;
	string back_url = 6;
	string bet_limit = 7;
	string language = 8;
}

// The response message containing the greetings.
message GameInterfaceAwcServiceReply {
	bool success = 1;
}

message GameInterfaceAwcServiceFundReply {
	bool success = 1;
	string message = 2;
	string transaction_id = 3;
	string game_provider_transaction_id = 4;
	phoenix.protobuf.DecimalValue amount = 5;
	phoenix.protobuf.DecimalValue current_balance = 6;
}

message GameInterfaceAwcServiceFundOrderCheckingReply {
	bool exist = 1;
}

message GameInterfaceAwcServiceBalanceReply {
	bool success = 1;
	string message = 2;
	bool is_player_exist = 3;
	phoenix.protobuf.DecimalValue balance = 4;
}

message GameInterfaceAwcServiceGameUrlReply {
	bool success = 1;
	string message = 2;
	bool is_player_exist = 3;
	string game_url = 4;
}
