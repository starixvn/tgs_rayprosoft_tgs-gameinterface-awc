syntax = "proto3";

import "phoenix/protobuf/decimal.proto";
import "google/protobuf/timestamp.proto";

option csharp_namespace = "Tgs.GameInterface.Awc.Protos";

package gameinterfaceawc;

// The greeting service definition.
service GameInterfaceAwc {
  // Sends a greeting
  rpc PlayerCreate (PlayerCreateRequest) returns (BaseReply);
  rpc PlayerCreateByBetLimit (PlayerCreateByBetLimitRequest) returns (BaseReply);
  rpc PlayerBalance (PlayerBalanceRequest) returns (PlayerBalanceReply);
  rpc FundIn (FundRequest) returns (FundReply);
  rpc FundOut (FundRequest) returns (FundReply);
  rpc FundStatus(FundStatusRequest) returns (BaseReply);
  rpc AllBalances (AllBalancesRequest) returns (AllBalancesReply);
  rpc PlayerLogout (PlayerLogoutRequest) returns (BaseReply);
  rpc GameUrlByAwcFs (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcKm (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcLudo (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcPgs (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcSpade (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcYl (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcCockfight (GameUrlByLiveLobbyRequest) returns (GameUrlReply);
  rpc GameUrlByAwcRcb (GameUrlByLiveLobbyRequest) returns (GameUrlReply);
  rpc GameUrlByAwcSg (GameUrlByLiveLobbyRequest) returns (GameUrlReply);
  rpc GameUrlByAwcVenus (GameUrlByLiveLobbyRequest) returns (GameUrlReply);
  rpc GameUrlByAwcYesbingo (GameUrlRequest) returns (GameUrlReply);
  rpc GameUrlByAwcBg (GameUrlByLiveLobbyRequest) returns (GameUrlReply);
  rpc CheckingService(CheckingServiceRequest) returns (CheckingServiceReply);
}

// The request message containing the user's name.
message PlayerCreateRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	string user_name = 5;
	string currency = 6;
	string language = 7;
}

message PlayerCreateByBetLimitRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	string user_name = 5;
	string currency = 6;
	string bet_limit = 7;
	string language = 8;
}

message PlayerBalanceRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
}

message FundRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	string order_id = 5;
	phoenix.protobuf.DecimalValue amount = 6;
}

message FundStatusRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string order_id = 4;
}

message AllBalancesRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
}

message PlayerLogoutRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
}

message GameUrlRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	bool is_mobile_login = 5;
	string back_url = 6;
	string external_game_id = 7;
	string language = 8;
}

message GameUrlByLiveLobbyRequest {
	string api_url = 1 ;
	string agent_id = 2;
	string cert = 3;
	string player_code = 4;
	bool is_mobile_login = 5;
	string back_url = 6;
	string bet_limit = 7;
	string language = 8;
}

message CheckingServiceRequest{
    string machine_name = 1;
}

// The response message containing the greetings.
message BaseReply {
	bool state = 1;
}

message PlayerBalanceReply {
	bool is_player_exist = 1;
	phoenix.protobuf.DecimalValue balance = 2;
}

message FundReply {
	string order_id = 1;
	string game_provider_transaction_id = 2;
	phoenix.protobuf.DecimalValue amount = 3;
	phoenix.protobuf.DecimalValue current_balance = 4;
	string resp = 5;
}

message AllBalancesReply {
	repeated BalanceInfo items = 1;
}

message BalanceInfo {
	string player_code = 1;
	phoenix.protobuf.DecimalValue balance = 2;
	google.protobuf.Timestamp last_modified = 3; 
}

message GameUrlReply {
	bool is_player_exist = 3;
	string game_url = 4;
}

message CheckingServiceReply{
    string machine_name = 1;
}
